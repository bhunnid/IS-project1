# /etc/nginx/sites-available/app  (managed from the repo: deploy/nginx-app.conf)
# Needs these existing snippets: ssl-zerossl.conf, ssl-common.conf, phpapp.conf

# ---- main site: HTTP -> HTTPS, www -> apex ----
server {
    listen 80 default_server;
    server_name serveradminproject.me www.serveradminproject.me;
    return 301 https://serveradminproject.me$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    server_name serveradminproject.me;
    include snippets/ssl-zerossl.conf;
    root /var/www/app;
    index index.php index.html;

    # never expose internal folders on the main domain
    location ~ ^/(honeypot|statuspage|adminpanel|db|server|deploy)(/|$) { return 404; }

    location / { try_files $uri $uri/ =404; }
    include snippets/phpapp.conf;
}

# ---- admin panel: HTTPS + basic auth ----
server {
    listen 80;
    server_name admin.serveradminproject.me;
    return 301 https://admin.serveradminproject.me$request_uri;
}
server {
    listen 443 ssl http2;
    server_name admin.serveradminproject.me;
    ssl_certificate     /etc/ssl/zerossl/admin/fullchain.crt;
    ssl_certificate_key /etc/ssl/zerossl/admin/private.key;
    include snippets/ssl-common.conf;
    root /var/www/app/adminpanel;
    index index.php;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / { try_files $uri $uri/ =404; }
    include snippets/phpapp.conf;
}

# ---- live status dashboard: HTTPS ----
server {
    listen 80;
    server_name status.serveradminproject.me;
    return 301 https://status.serveradminproject.me$request_uri;
}
server {
    listen 443 ssl http2;
    server_name status.serveradminproject.me;
    ssl_certificate     /etc/ssl/zerossl/status/fullchain.crt;
    ssl_certificate_key /etc/ssl/zerossl/status/private.key;
    include snippets/ssl-common.conf;
    root /var/www/app/statuspage;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    include snippets/phpapp.conf;
}

# ---- honeypot: plain HTTP on purpose (attackers scan HTTP); every path -> index.php ----
server {
    listen 80;
    server_name trap.serveradminproject.me;
    root /var/www/app/honeypot;
    access_log /var/log/nginx/trap.access.log;
    server_tokens off;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
